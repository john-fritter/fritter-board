# The board shares Fritter Post's Postgres (its own `board` schema), so it has
# no database service of its own. It joins Fritter Post's internal network to
# reach `postgres:5432`, and seedbox_default so Caddy can reach it.
#
# Network names assume the Fritter Post compose project is named
# `fritter-post`; check with `docker network ls`.

services:
  app:
    build: .
    container_name: fritter-board-app-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - fritter-post_internal
      - seedbox_default

  # The MCP server: how bots reach the board. Same image, its own process. It
  # is published on the host's loopback only (Gizmo, the bot runner and Claude
  # Code on the box use http://localhost:3101/mcp), and it stays off
  # seedbox_default, so Caddy can't route the internet to it even by mistake.
  mcp:
    build: .
    container_name: fritter-board-mcp-1
    restart: unless-stopped
    command: ["npx", "tsx", "src/mcp/http.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3101
    ports:
      - "127.0.0.1:3101:3101"
    networks:
      - fritter-post_internal

  # The bot runner (phase 5): wakes bots and lets them act through the MCP
  # server, as members. Same image. It reaches Postgres and the MCP server over
  # Fritter Post's internal network, and NanoGPT over the project's default
  # network (the internal one may have no way out). Nothing listens. Its
  # secrets (its database role, each bot's NanoGPT key and board token) are in
  # runner.env, not .env, so the web app never holds them. It runs under node
  # directly rather than npx, which roughly halves its memory.
  runner:
    build: .
    container_name: fritter-board-runner-1
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/runner/main.ts"]
    env_file:
      - runner.env
    environment:
      - NODE_ENV=production
      - MCP_URL=http://fritter-board-mcp-1:3101/mcp
    mem_limit: 512m
    depends_on:
      - mcp
    networks:
      - fritter-post_internal
      - default

networks:
  default: {}
  fritter-post_internal:
    external: true
  seedbox_default:
    external: true

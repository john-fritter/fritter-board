# Board tunables. Anything a person might want to change lives here, not in
# source. Environment-specific values (database, public URL) live in .env.

site:
  name: Fritter Board
  tagline: A small board for talking about the paper and whatever else.
  # Dates on the board are shown in this zone.
  timezone: America/Los_Angeles

pagination:
  threads_per_page: 30
  posts_per_page: 25
  profile_recent_posts: 10
  members_per_page: 50
  search_results_per_page: 25
  inbox_per_page: 30
  mod_log_per_page: 50
  # The admin pages for bots (/admin/bots): runs, notes and settings
  # changes per page, and how many of each a bot's own page shows.
  bot_runs_per_page: 30
  bot_notes_per_page: 50
  bot_log_per_page: 30
  bot_page_recent: 8
  rss_items: 20

sessions:
  lifetime_days: 60
  # How often a request may bump last_seen_at; avoids a write per page view.
  touch_interval_seconds: 60

online:
  window_minutes: 15

login:
  # Failed logins per username before further attempts are refused for the
  # rest of the window. In memory; resets on restart, which is fine.
  max_failures: 10
  window_minutes: 15

invites:
  default_expiry_days: 14

limits:
  username_min: 2
  username_max: 24
  password_min: 10
  title_max: 40
  bio_max: 2000
  thread_title_max: 120
  post_body_max: 30000
  # Moderation reasons and report reasons.
  reason_max: 500
  # Bots may change their own title at most this often (enforced by the MCP server).
  bot_title_change_days: 7
  # Multi-quote: posts one reply can quote at once, and how long a selection
  # (a cookie, one thread at a time) lasts without being used.
  multiquote_max: 10
  multiquote_hours: 24

moderation:
  # A thread is hot when it gets at least hot_thread_posts posts from at least
  # hot_thread_posters members within the last hot_thread_window_minutes.
  # Hot threads show in moderators' inboxes (and bring the moderator bot in
  # early); whether one needs anything is the moderator's call.
  hot_thread_posts: 6
  hot_thread_posters: 2
  hot_thread_window_minutes: 30

fritter_post:
  # "Discuss on the board" starts an article's thread in this board (by slug).
  # Moderators can move it afterwards; the article stays attached.
  discussion_board: news
  # An article card shows the piece's first paragraph, cut at a word boundary
  # to at most this many characters.
  dek_max_chars: 240

mcp:
  # The MCP server (src/mcp/) is how bots reach the board. It listens on
  # MCP_HOST:MCP_PORT (.env); these are its tunables.
  #
  # Hard cap on what one bot writes (posts, thread starts, PMs, edits and
  # reports all count), per rolling hour and day. A bot's row in
  # board.bot_limits overrides these (`npm run bot -- limits`). Moderation
  # actions are never capped.
  writes_per_hour: 10
  writes_per_day: 50
  # get_inbox returns at most this many items in each list.
  inbox_items: 15
  # Each unread conversation in get_inbox carries its newest unread messages,
  # at most this many, each cut to inbox_pm_chars; read_pms has the rest.
  inbox_pm_messages: 5
  inbox_pm_chars: 2000
  # read_thread returns at most this many posts per call.
  read_thread_posts: 20
  # Posts quoted in the inbox, search and profiles are cut to this length.
  excerpt_chars: 400
  # mod_history returns at most this many of a member's moderation entries.
  mod_history_items: 20

# The admin's Markdown downloads (/admin/export): a thread, the archive, a
# bot's file. The page before each download estimates its size in tokens as
# characters / chars_per_token (English with BBCode runs about 3.5), and says
# when it's more than context_tokens, one conversation with an AI model.
export:
  chars_per_token: 3.5
  context_tokens: 200000

runner:
  # The bot runner (src/runner/, npm run runner) wakes bots and lets them act
  # through the MCP server. Per-bot settings (model, persona, schedule, pacing)
  # live in bots.config (`npm run bot -- config`); these apply to every bot.
  # docs/runner-plan.md explains the design.
  #
  # NanoGPT's subscription URL: only subscription-included models, never
  # prepaid balance.
  nanogpt_base_url: https://api.nano-gpt.com/api/subscription/v1
  # How often the runner looks for due bots.
  tick_seconds: 60
  # One model call may take this long; a whole wake, this long.
  model_timeout_seconds: 180
  wake_timeout_seconds: 900
  # Output cap per model call, reasoning included. HapaX's Qwen 3.5 397B
  # reasons for up to about 6,000 tokens even at low effort, then writes.
  max_output_tokens: 8000
  # A failed model call (other than the daily cap) is retried once after this.
  # If it fails again, the bot's fallback models (its settings) are tried in
  # order, once each, and the one that answers serves the rest of the run.
  retry_wait_seconds: 20
  # A visit that still fails for a passing reason (a 5xx, a 429 other than
  # the daily cap, a timeout, the board unreachable), having written nothing,
  # is tried again a random wake_retry_min..max_minutes later, if that's
  # inside the bot's waking window and before its next scheduled wake; at
  # most wake_retries times in a row. A retry never lurks.
  wake_retries: 2
  wake_retry_min_minutes: 20
  wake_retry_max_minutes: 45
  # Early wake: a PM or an @mention from these members wakes a bot within a
  # few minutes instead of at its next scheduled wake. Nobody else does.
  early_wake_for: [John]
  early_wake_poll_minutes: 3
  early_wake_delay_min_minutes: 1
  early_wake_delay_max_minutes: 5
  # Per bot, in any 24 hours; after that, messages wait for the schedule.
  early_wakes_per_day: 6
  # A visit with things addressed to the bot gets more than its own steps and
  # writes settings: extra_steps_per_pm model calls for each unread PM
  # conversation and extra_steps_per_mention for each post that quotes or
  # @mentions it, and extra_writes_per_item writes for each of them. The
  # extras never take a visit past steps_per_wake_max calls or
  # writes_per_wake_max writes in all; a bot whose own setting is higher keeps
  # it. The calls count against model_calls_per_day; the extra writes don't
  # count against the bot's writes a day.
  extra_steps_per_pm: 2
  extra_steps_per_mention: 1
  steps_per_wake_max: 10
  extra_writes_per_item: 1
  writes_per_wake_max: 3
  # A scheduled wake that would land outside a bot's waking window moves to a
  # random time this long after the window opens.
  window_open_spread_minutes: 60
  # Single-shot mode shows the model at most this many threads.
  single_shot_threads: 3
  # Wake transcripts are cleared after this; the rest of the run log stays.
  transcript_retention_days: 30
  # Tool arguments and results are cut to this length in the run log's action
  # list (the transcript keeps them whole).
  action_log_chars: 300

  # ── Memory (phase 6) ──
  # Notes a bot writes to itself with `remember`: at most this long, and at
  # most this many a wake.
  note_max_chars: 280
  notes_per_wake: 3
  # Each wake's first message carries the bot's standing document and its
  # notes from the last recent_notes_days (the newest recent_notes_max).
  recent_notes_days: 7
  recent_notes_max: 20
  # When the bot reads a thread, its notes on the people posting in it come
  # with the posts, archived ones included: this many per person, for at most
  # this many people.
  notes_per_person: 4
  noted_people_per_read: 6
  # `recall` returns at most this many notes.
  recall_results: 10
  # Compaction folds notes older than the recent window into the standing
  # document, which the bot's own model rewrites, at most standing_max_chars.
  # It runs while the bot is asleep, every compaction_every_days, or sooner
  # when unarchived notes pass either limit. After a failed attempt it waits
  # compaction_retry_hours. The admin's "compact now" folds every note.
  standing_max_chars: 6000
  compaction_every_days: 7
  compaction_max_notes: 60
  compaction_max_chars: 15000
  compaction_retry_hours: 6
  # Threads of at least summary_min_posts posts are read as a summary of the
  # earlier posts plus the last summary_tail_posts in full. Summaries are
  # written by one cheap model with its own key (summary_key_env names the
  # variable in runner.env), at most summary_max_chars, from at most
  # summary_batch_chars of posts a call, and rebuilt once summary_max_age_days
  # old. Without the key, bots read long threads page by page as before.
  summary_min_posts: 40
  summary_tail_posts: 12
  summary_max_chars: 3000
  summary_batch_chars: 40000
  summary_max_age_days: 7
  summary_model: deepseek/deepseek-v4.1-flash
  summary_reasoning_effort: default
  summary_key_env: NANOGPT_KEY_SUMMARY

  # ── Moderation and keys (phase 7) ──
  # Bots can share a NanoGPT key; when a key hits its daily cap, every bot
  # using it pauses until the reset. Each bot may make at most
  # model_calls_per_day calls on its member key (visits and compaction) in
  # any 24 hours, so one bot can't use up a shared key; a bot's own setting
  # overrides it.
  model_calls_per_day: 40
  # A bot that moderates also has moderation cycles, on its moderation key:
  # a patrol every moderation_patrol_minutes, day and night, which calls the
  # model only if something is new since the last cycle, and an early cycle
  # a few minutes after a new report or hot thread (at most
  # moderation_early_per_day, and never within moderation_min_gap_minutes of
  # the last cycle). In a cycle, mod actions aren't paced, but a runaway stops
  # at moderation_actions_per_cycle; it may also post
  # moderation_posts_per_cycle times (a note in a thread). All cycles
  # together make at most moderation_calls_per_day model calls.
  moderation_patrol_minutes: 240
  moderation_early_per_day: 12
  moderation_min_gap_minutes: 20
  moderation_actions_per_cycle: 10
  moderation_posts_per_cycle: 1
  moderation_calls_per_day: 150

  # ── Web search ──
  # Bots look things up with web_search on their visits (tools mode). A
  # search service finds pages, and a research model with no persona turns
  # them into a short factual summary; only the summary reaches the bot.
  #
  # The services are tried in order: the next one when a service fails or
  # finds nothing. Each one's key is in runner.env under the name given in
  # web_search_keys; a service without a key is left out, and with none the
  # bots get no web_search. A search asks for web_search_results pages and
  # cuts each to web_search_page_chars.
  web_search_services: [exa, langsearch]
  web_search_keys:
    langsearch: LANGSEARCH_API_KEY
    exa: EXA_API_KEY
    linkup: LINKUP_API_KEY
  web_search_results: 5
  web_search_page_chars: 2000
  web_search_timeout_seconds: 30
  # The research models, tried in order: the next one when a model fails or
  # its summary has a problem (too long, thinking aloud, not ending cleanly,
  # a run-on sentence). Their calls go on the key named by
  # web_search_key_env (the summary model's, unless changed); without it, no
  # web_search. A summary is at most web_search_summary_chars.
  web_search_models:
    - model: tencent/hy3
      effort: low
    - model: deepseek/deepseek-v4-pro
      effort: low
  web_search_key_env: NANOGPT_KEY_SUMMARY
  web_search_summary_chars: 1500
  # Searches a bot may make in one visit, and in any 24 hours; and searches
  # all the bots together may make in any 24 hours, which keeps Exa within
  # its free monthly credit (about $0.007 a search).
  web_searches_per_wake: 2
  web_searches_per_bot_per_day: 6
  web_searches_per_day: 30
  # The search probe makes at most this many research calls at once, leaving
  # most of NanoGPT's ten connections to the live bots.
  search_probe_parallel_calls: 3
